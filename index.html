<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Curated Reads · 每日英文热点长文</title>
<meta name="description" content="每天一篇英文热点长文：公开信、辞职信、深度评论，原文全文 + 中文导读 + 打分。">
<link rel="preload" as="image" href="img/bg.jpg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>

<header class="top">
  <div class="wrap bar">
    <div class="brand">
      <span class="mark">R</span>
      <span class="name">Curated Reads</span>
    </div>
    <div class="today" id="today"></div>
  </div>
</header>

<main class="wrap">
  <section class="lead">
    <h1>每天一篇<br>值得读完的英文长文</h1>
    <p class="lede">热点优先：公开信、辞职信、巨头内部信、深度评论。英文原文整篇放在页面上，中文导读只负责帮你判断值不值得读。</p>
  </section>

  <section id="hero" class="hero" hidden></section>

  <div class="section-head">
    <h2>往期</h2>
    <div class="sort">
      <button class="chip on" data-sort="date">最新</button>
      <button class="chip" data-sort="score">我的评分</button>
    </div>
  </div>

  <section id="list" class="list"></section>
  <p id="empty" class="empty" hidden>还没有内容。生成脚本跑过一次后，这里会出现第一期。</p>

  <footer class="foot">
    <p>选品只收英文原文（Aeon / Works in Progress / The Atlantic / Nautilus / Quanta 等公开 RSS），按热点与站点权重排序，写过的不重复。中文导读由模型生成，可能失真，以原文为准。</p>
  </footer>
</main>

<script src="app.js"></script>
</body>
</html>
